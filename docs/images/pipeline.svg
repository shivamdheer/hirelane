<text x="743" y="130" font-size="20" font-weight="650" fill="#e6edf3" text-anchor="start">Tailor</text>
<text x="707" y="160" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">Pick and order bullets</text>
<text x="707" y="182" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">from approved facts</text>
