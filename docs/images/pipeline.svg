<circle cx="58" cy="479" r="13" fill="none" stroke="#4fa3b8" stroke-width="1.6"/>
<text x="58" y="484.5" font-size="14.5" font-weight="600" fill="#4fa3b8" text-anchor="middle">7</text>
<text x="83" y="486" font-size="20" font-weight="650" fill="#e6edf3" text-anchor="start">Verify check</text>
<text x="47" y="516" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">Read the form back and</text>
<text x="47" y="538" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">compare it to the plan</text>
