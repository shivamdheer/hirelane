<text x="718" y="484.5" font-size="14.5" font-weight="600" fill="#8b9bb4" text-anchor="middle">9</text>
<text x="743" y="486" font-size="20" font-weight="650" fill="#e6edf3" text-anchor="start">Track replies</text>
<text x="707" y="516" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">Gmail replies sort jobs,</text>
<text x="707" y="538" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">one daily note</text>
