<rect x="0.5" y="0.5" width="999" height="799" rx="13.5" fill="none" stroke="#30363d"/>
<text x="34" y="54" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start">From a job board to a form waiting for you</text>
<clipPath id="c1"><rect x="25" y="90" width="290" height="120" rx="10"/></clipPath>
<rect x="25" y="90" width="290" height="120" rx="10" fill="#161b22"/>
