[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hirelane"
version = "0.1.0"
description = "Find roles, tailor your resume truthfully, and apply with a human in the loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "keyring>=25,<26",
    "pypdf>=5,<7",
    "reportlab>=4,<5",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2,<3",
]
browser = ["playwright>=1.45,<2"]
google = [
    "google-api-python-client>=2.100,<3",
    "google-auth-oauthlib>=1.2,<2",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
hirelane = "hirelane.cli:main"

[tool.setuptools.packages.find]
include = ["hirelane*"]

[tool.setuptools.package-data]
hirelane = ["web/templates/*.html", "web/static/*", "templates/*", "submit/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: drives a local Chromium against HTML fixtures, no network"]
filterwarnings = [
    # fastapi's TestClient still goes through httpx. Nothing to change on our side.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["hirelane"]

[[tool.mypy.overrides]]
module = ["keyring.*", "reportlab.*", "googleapiclient.*", "google_auth_oauthlib.*", "google.*", "playwright.*"]
ignore_missing_imports = true
