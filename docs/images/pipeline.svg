<text x="743" y="308" font-size="20" font-weight="650" fill="#e6edf3" text-anchor="start">Build the PDF</text>
<text x="707" y="338" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">One page, ATS safe,</text>
