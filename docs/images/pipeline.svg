<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Hirelane pipeline</title><desc id="d">Nine steps from public job boards to a filled form waiting for review.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#93a09a"/></marker>
<linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1714"/><stop offset="1" stop-color="#0e1214"/></linearGradient>
</defs>
<rect width="1200" height="640" rx="22" fill="url(#plate)"/>
<rect x="1" y="1" width="1198" height="638" rx="21" fill="none" stroke="#2a3531" stroke-width="2"/>
<text x="48" y="56" font-size="24" font-weight="700" fill="#e8eeeb" text-anchor="start">From a job board to a form waiting for you</text>
<rect x="40" y="100" width="192" height="110" rx="14" fill="#161d1b" stroke="#6aa9ff" stroke-opacity="0.55" stroke-width="1.5"/>
<rect x="40" y="114" width="5" height="82" rx="2.5" fill="#6aa9ff"/>
<circle cx="70" cy="130" r="13" fill="#6aa9ff"/>
<text x="70" y="135.5" font-size="15" font-weight="700" fill="#0b1210" text-anchor="middle">1</text>
<text x="94" y="135" font-size="17" font-weight="650" fill="#e8eeeb" text-anchor="start">Job boards</text>
<text x="62" y="162" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">Greenhouse, Lever and</text>
<text x="62" y="182" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">Ashby public lists</text>
<line x1="238" y1="155.0" x2="266" y2="155.0" stroke="#93a09a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="272" y="100" width="192" height="110" rx="14" fill="#161d1b" stroke="#6aa9ff" stroke-opacity="0.55" stroke-width="1.5"/>
<rect x="272" y="114" width="5" height="82" rx="2.5" fill="#6aa9ff"/>
<circle cx="302" cy="130" r="13" fill="#6aa9ff"/>
<text x="302" y="135.5" font-size="15" font-weight="700" fill="#0b1210" text-anchor="middle">2</text>
<text x="326" y="135" font-size="17" font-weight="650" fill="#e8eeeb" text-anchor="start">Filter and score</text>
<text x="294" y="162" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">Level, place, pay,</text>
<text x="294" y="182" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">skills fit A to C</text>
<line x1="470" y1="155.0" x2="498" y2="155.0" stroke="#93a09a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="504" y="100" width="192" height="110" rx="14" fill="#161d1b" stroke="#4cd9a0" stroke-opacity="0.55" stroke-width="1.5"/>
<rect x="504" y="114" width="5" height="82" rx="2.5" fill="#4cd9a0"/>
<circle cx="534" cy="130" r="13" fill="#4cd9a0"/>
<text x="534" y="135.5" font-size="15" font-weight="700" fill="#0b1210" text-anchor="middle">3</text>
<text x="558" y="135" font-size="17" font-weight="650" fill="#e8eeeb" text-anchor="start">Tailor</text>
<text x="526" y="162" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">Pick and order bullets</text>
<text x="526" y="182" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">from approved facts</text>
<line x1="702" y1="155.0" x2="730" y2="155.0" stroke="#93a09a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="736" y="100" width="192" height="110" rx="14" fill="#161d1b" stroke="#4cd9a0" stroke-opacity="0.55" stroke-width="1.5"/>
<rect x="736" y="114" width="5" height="82" rx="2.5" fill="#4cd9a0"/>
<circle cx="766" cy="130" r="13" fill="#4cd9a0"/>
<text x="766" y="135.5" font-size="15" font-weight="700" fill="#0b1210" text-anchor="middle">4</text>
<text x="790" y="135" font-size="17" font-weight="650" fill="#e8eeeb" text-anchor="start">Build the PDF</text>
<text x="758" y="162" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">One page, ATS safe,</text>
<text x="758" y="182" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">read back and audited</text>
<line x1="934" y1="155.0" x2="962" y2="155.0" stroke="#93a09a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="968" y="100" width="192" height="110" rx="14" fill="#161d1b" stroke="#f2b45e" stroke-opacity="0.55" stroke-width="1.5"/>
<rect x="968" y="114" width="5" height="82" rx="2.5" fill="#f2b45e"/>
<circle cx="998" cy="130" r="13" fill="#f2b45e"/>
<text x="998" y="135.5" font-size="15" font-weight="700" fill="#0b1210" text-anchor="middle">5</text>
<text x="1022" y="135" font-size="17" font-weight="650" fill="#e8eeeb" text-anchor="start">You approve</text>
<text x="990" y="162" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">Web page or command</text>
<text x="990" y="182" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">or auto for fit A</text>
<line x1="1064.0" y1="216" x2="1064.0" y2="274" stroke="#93a09a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="968" y="280" width="192" height="110" rx="14" fill="#161d1b" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.5"/>
<rect x="968" y="294" width="5" height="82" rx="2.5" fill="#a78bfa"/>
<circle cx="998" cy="310" r="13" fill="#a78bfa"/>
<text x="998" y="315.5" font-size="15" font-weight="700" fill="#0b1210" text-anchor="middle">6</text>
<text x="1022" y="315" font-size="17" font-weight="650" fill="#e8eeeb" text-anchor="start">Fill the form</text>
<text x="990" y="342" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">Playwright types your</text>
<text x="990" y="362" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">details and resume</text>
<line x1="962" y1="335.0" x2="934" y2="335.0" stroke="#93a09a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="736" y="280" width="192" height="110" rx="14" fill="#161d1b" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.5"/>
<rect x="736" y="294" width="5" height="82" rx="2.5" fill="#a78bfa"/>
<circle cx="766" cy="310" r="13" fill="#a78bfa"/>
<text x="766" y="315.5" font-size="15" font-weight="700" fill="#0b1210" text-anchor="middle">7</text>
<text x="790" y="315" font-size="17" font-weight="650" fill="#e8eeeb" text-anchor="start">Verify check</text>
<text x="758" y="342" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">Read the form back,</text>
<text x="758" y="362" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">compare to the plan</text>
<line x1="730" y1="335.0" x2="702" y2="335.0" stroke="#93a09a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="504" y="280" width="192" height="110" rx="14" fill="#161d1b" stroke="#f2b45e" stroke-opacity="0.55" stroke-width="1.5"/>
<rect x="504" y="294" width="5" height="82" rx="2.5" fill="#f2b45e"/>
<circle cx="534" cy="310" r="13" fill="#f2b45e"/>
<text x="534" y="315.5" font-size="15" font-weight="700" fill="#0b1210" text-anchor="middle">8</text>
<text x="558" y="315" font-size="17" font-weight="650" fill="#e8eeeb" text-anchor="start">Review mode</text>
<text x="526" y="342" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">Stops unsent so you</text>
<text x="526" y="362" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">look and submit</text>
<line x1="498" y1="335.0" x2="470" y2="335.0" stroke="#93a09a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="272" y="280" width="192" height="110" rx="14" fill="#161d1b" stroke="#5ad1e6" stroke-opacity="0.55" stroke-width="1.5"/>
<rect x="272" y="294" width="5" height="82" rx="2.5" fill="#5ad1e6"/>
<circle cx="302" cy="310" r="13" fill="#5ad1e6"/>
<text x="302" y="315.5" font-size="15" font-weight="700" fill="#0b1210" text-anchor="middle">9</text>
<text x="326" y="315" font-size="17" font-weight="650" fill="#e8eeeb" text-anchor="start">Track replies</text>
<text x="294" y="342" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">Gmail replies sort</text>
<text x="294" y="362" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">jobs, one daily note</text>
<line x1="832.0" y1="396" x2="832.0" y2="464" stroke="#93a09a" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<text x="846.0" y="428" font-size="13.5" font-weight="400" fill="#ff8a8f" text-anchor="start">fails, or a CAPTCHA</text>
<rect x="736" y="470" width="192" height="92" rx="14" fill="#161d1b" stroke="#ff8a8f" stroke-opacity="0.55" stroke-width="1.5"/>
<rect x="736" y="484" width="5" height="64" rx="2.5" fill="#ff8a8f"/>
<text x="758" y="505" font-size="17" font-weight="650" fill="#e8eeeb" text-anchor="start">Needs you</text>
<text x="758" y="532" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">Saved for you to</text>
<text x="758" y="552" font-size="13.5" font-weight="400" fill="#93a09a" text-anchor="start">finish by hand</text>
<text x="48" y="556" font-size="14" font-weight="650" fill="#93a09a" text-anchor="start">Colour key</text>
<circle cx="55" cy="587" r="7" fill="#6aa9ff"/>
<text x="70" y="592" font-size="14" font-weight="400" fill="#e8eeeb" text-anchor="start">Find</text>
<circle cx="145" cy="587" r="7" fill="#4cd9a0"/>
<text x="160" y="592" font-size="14" font-weight="400" fill="#e8eeeb" text-anchor="start">Tailor</text>
<circle cx="251" cy="587" r="7" fill="#f2b45e"/>
<text x="266" y="592" font-size="14" font-weight="400" fill="#e8eeeb" text-anchor="start">You decide</text>
<circle cx="389" cy="587" r="7" fill="#a78bfa"/>
<text x="404" y="592" font-size="14" font-weight="400" fill="#e8eeeb" text-anchor="start">Apply</text>
<circle cx="487" cy="587" r="7" fill="#5ad1e6"/>
<text x="502" y="592" font-size="14" font-weight="400" fill="#e8eeeb" text-anchor="start">Track</text>
<circle cx="585" cy="587" r="7" fill="#ff8a8f"/>
<text x="600" y="592" font-size="14" font-weight="400" fill="#e8eeeb" text-anchor="start">Stops</text>
</svg>
