<text x="413" y="308" font-size="20" font-weight="650" fill="#e6edf3" text-anchor="start">You approve</text>
<text x="377" y="338" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">Web page or command,</text>
<text x="377" y="360" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">or auto for fit A</text>
