<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Hirelane pipeline</title><desc id="d">Nine steps from public job boards to a filled form waiting for review.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a5accb"/></marker>
<linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1024"/><stop offset="1" stop-color="#0b0d1a"/></linearGradient>
</defs>
<rect width="1000" height="800" rx="22" fill="url(#plate)"/>
<rect x="1" y="1" width="998" height="798" rx="21" fill="none" stroke="#2b3253" stroke-width="2"/>
<text x="34" y="54" font-size="26" font-weight="700" fill="#e9ebf8" text-anchor="start">From a job board to a form waiting for you</text>
<rect x="25" y="90" width="290" height="120" rx="14" fill="#151a2e" stroke="#6ea8ff" stroke-opacity="0.6" stroke-width="1.5"/>
<rect x="25" y="104" width="5" height="92" rx="2.5" fill="#6ea8ff"/>
<circle cx="58" cy="123" r="14" fill="#6ea8ff"/>
<text x="58" y="129" font-size="16" font-weight="700" fill="#0b1210" text-anchor="middle">1</text>
<text x="83" y="130" font-size="20" font-weight="650" fill="#e9ebf8" text-anchor="start">Job boards</text>
<text x="47" y="160" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">Greenhouse, Lever and</text>
<text x="47" y="182" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">Ashby public lists</text>
<rect x="355" y="90" width="290" height="120" rx="14" fill="#151a2e" stroke="#6ea8ff" stroke-opacity="0.6" stroke-width="1.5"/>
<rect x="355" y="104" width="5" height="92" rx="2.5" fill="#6ea8ff"/>
<circle cx="388" cy="123" r="14" fill="#6ea8ff"/>
<text x="388" y="129" font-size="16" font-weight="700" fill="#0b1210" text-anchor="middle">2</text>
<text x="413" y="130" font-size="20" font-weight="650" fill="#e9ebf8" text-anchor="start">Filter and score</text>
<text x="377" y="160" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">Level, place, pay and</text>
<text x="377" y="182" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">skills, fit A to C</text>
<rect x="685" y="90" width="290" height="120" rx="14" fill="#151a2e" stroke="#a98bff" stroke-opacity="0.6" stroke-width="1.5"/>
<rect x="685" y="104" width="5" height="92" rx="2.5" fill="#a98bff"/>
<circle cx="718" cy="123" r="14" fill="#a98bff"/>
<text x="718" y="129" font-size="16" font-weight="700" fill="#0b1210" text-anchor="middle">3</text>
<text x="743" y="130" font-size="20" font-weight="650" fill="#e9ebf8" text-anchor="start">Tailor</text>
<text x="707" y="160" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">Pick and order bullets</text>
<text x="707" y="182" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">from approved facts</text>
<rect x="685" y="268" width="290" height="120" rx="14" fill="#151a2e" stroke="#a98bff" stroke-opacity="0.6" stroke-width="1.5"/>
<rect x="685" y="282" width="5" height="92" rx="2.5" fill="#a98bff"/>
<circle cx="718" cy="301" r="14" fill="#a98bff"/>
<text x="718" y="307" font-size="16" font-weight="700" fill="#0b1210" text-anchor="middle">4</text>
<text x="743" y="308" font-size="20" font-weight="650" fill="#e9ebf8" text-anchor="start">Build the PDF</text>
<text x="707" y="338" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">One page, ATS safe,</text>
<text x="707" y="360" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">read back and audited</text>
<rect x="355" y="268" width="290" height="120" rx="14" fill="#151a2e" stroke="#f58bd8" stroke-opacity="0.6" stroke-width="1.5"/>
<rect x="355" y="282" width="5" height="92" rx="2.5" fill="#f58bd8"/>
<circle cx="388" cy="301" r="14" fill="#f58bd8"/>
<text x="388" y="307" font-size="16" font-weight="700" fill="#0b1210" text-anchor="middle">5</text>
<text x="413" y="308" font-size="20" font-weight="650" fill="#e9ebf8" text-anchor="start">You approve</text>
<text x="377" y="338" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">Web page or command,</text>
<text x="377" y="360" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">or auto for fit A</text>
<rect x="25" y="268" width="290" height="120" rx="14" fill="#151a2e" stroke="#5ccfff" stroke-opacity="0.6" stroke-width="1.5"/>
<rect x="25" y="282" width="5" height="92" rx="2.5" fill="#5ccfff"/>
<circle cx="58" cy="301" r="14" fill="#5ccfff"/>
<text x="58" y="307" font-size="16" font-weight="700" fill="#0b1210" text-anchor="middle">6</text>
<text x="83" y="308" font-size="20" font-weight="650" fill="#e9ebf8" text-anchor="start">Fill the form</text>
<text x="47" y="338" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">Playwright types your</text>
<text x="47" y="360" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">details and resume</text>
<rect x="25" y="446" width="290" height="120" rx="14" fill="#151a2e" stroke="#5ccfff" stroke-opacity="0.6" stroke-width="1.5"/>
<rect x="25" y="460" width="5" height="92" rx="2.5" fill="#5ccfff"/>
<circle cx="58" cy="479" r="14" fill="#5ccfff"/>
<text x="58" y="485" font-size="16" font-weight="700" fill="#0b1210" text-anchor="middle">7</text>
<text x="83" y="486" font-size="20" font-weight="650" fill="#e9ebf8" text-anchor="start">Verify check</text>
<text x="47" y="516" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">Read the form back and</text>
<text x="47" y="538" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">compare it to the plan</text>
<rect x="355" y="446" width="290" height="120" rx="14" fill="#151a2e" stroke="#f58bd8" stroke-opacity="0.6" stroke-width="1.5"/>
<rect x="355" y="460" width="5" height="92" rx="2.5" fill="#f58bd8"/>
<circle cx="388" cy="479" r="14" fill="#f58bd8"/>
<text x="388" y="485" font-size="16" font-weight="700" fill="#0b1210" text-anchor="middle">8</text>
<text x="413" y="486" font-size="20" font-weight="650" fill="#e9ebf8" text-anchor="start">Review mode</text>
<text x="377" y="516" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">Stops unsent so you</text>
<text x="377" y="538" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">look and submit</text>
<rect x="685" y="446" width="290" height="120" rx="14" fill="#151a2e" stroke="#8c9bff" stroke-opacity="0.6" stroke-width="1.5"/>
<rect x="685" y="460" width="5" height="92" rx="2.5" fill="#8c9bff"/>
<circle cx="718" cy="479" r="14" fill="#8c9bff"/>
<text x="718" y="485" font-size="16" font-weight="700" fill="#0b1210" text-anchor="middle">9</text>
<text x="743" y="486" font-size="20" font-weight="650" fill="#e9ebf8" text-anchor="start">Track replies</text>
<text x="707" y="516" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">Gmail replies sort jobs,</text>
<text x="707" y="538" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">one daily note</text>
<line x1="321" y1="150.0" x2="349" y2="150.0" stroke="#a5accb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="651" y1="150.0" x2="679" y2="150.0" stroke="#a5accb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="321" y1="506.0" x2="349" y2="506.0" stroke="#a5accb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="651" y1="506.0" x2="679" y2="506.0" stroke="#a5accb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="679" y1="328.0" x2="651" y2="328.0" stroke="#a5accb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="349" y1="328.0" x2="321" y2="328.0" stroke="#a5accb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="830.0" y1="216" x2="830.0" y2="262" stroke="#a5accb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="170.0" y1="394" x2="170.0" y2="440" stroke="#a5accb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="170.0" y1="572" x2="170.0" y2="624" stroke="#a5accb" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<text x="186.0" y="604" font-size="15" font-weight="500" fill="#ff8fa3" text-anchor="start">fails, or a CAPTCHA</text>
<rect x="25" y="630" width="290" height="110" rx="14" fill="#151a2e" stroke="#ff8fa3" stroke-opacity="0.6" stroke-width="1.5"/>
<rect x="25" y="644" width="5" height="82" rx="2.5" fill="#ff8fa3"/>
<text x="47" y="670" font-size="20" font-weight="650" fill="#e9ebf8" text-anchor="start">Needs you</text>
<text x="47" y="700" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">Saved for you to</text>
<text x="47" y="722" font-size="15.5" font-weight="400" fill="#a5accb" text-anchor="start">finish by hand</text>
<text x="375" y="668" font-size="15" font-weight="650" fill="#a5accb" text-anchor="start">Colour key</text>
<circle cx="383" cy="695" r="8" fill="#6ea8ff"/>
<text x="403" y="700" font-size="16" font-weight="400" fill="#e9ebf8" text-anchor="start">Find</text>
<circle cx="573" cy="695" r="8" fill="#a98bff"/>
<text x="593" y="700" font-size="16" font-weight="400" fill="#e9ebf8" text-anchor="start">Tailor</text>
<circle cx="763" cy="695" r="8" fill="#f58bd8"/>
<text x="783" y="700" font-size="16" font-weight="400" fill="#e9ebf8" text-anchor="start">You decide</text>
<circle cx="383" cy="725" r="8" fill="#5ccfff"/>
<text x="403" y="730" font-size="16" font-weight="400" fill="#e9ebf8" text-anchor="start">Apply</text>
<circle cx="573" cy="725" r="8" fill="#8c9bff"/>
<text x="593" y="730" font-size="16" font-weight="400" fill="#e9ebf8" text-anchor="start">Track</text>
<circle cx="763" cy="725" r="8" fill="#ff8fa3"/>
<text x="783" y="730" font-size="16" font-weight="400" fill="#e9ebf8" text-anchor="start">Stops</text>
</svg>
