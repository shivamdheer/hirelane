<text x="388" y="484.5" font-size="14.5" font-weight="600" fill="#c9a45c" text-anchor="middle">8</text>
<text x="413" y="486" font-size="20" font-weight="650" fill="#e6edf3" text-anchor="start">Review mode</text>
<text x="377" y="516" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">Stops unsent so you</text>
<text x="377" y="538" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">look and submit</text>
<clipPath id="c9"><rect x="685" y="446" width="290" height="120" rx="10"/></clipPath>
