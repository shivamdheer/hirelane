{% extends "base.html" %}
{% block body %}
<h1>Sign in</h1>
<form method="post" action="/login">
  <p><label for="token">Access token</label><input id="token" name="token" type="password" autocomplete="current-password" autofocus></p>
  {% if error %}<p class="pill bad">{{ error }}</p>{% endif %}
  <button type="submit">Sign in</button>
</form>
{% endblock %}
