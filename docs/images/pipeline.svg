<text x="47" y="338" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">Playwright types your</text>
<text x="47" y="360" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">details and resume</text>
