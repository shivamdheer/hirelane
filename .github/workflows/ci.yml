name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,browser,google,dev]"
      - name: Install Chromium for the browser tests
        run: playwright install --with-deps chromium
      - name: Lint
        run: |
          ruff check .
          mypy hirelane
      - name: Test
        run: pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t hirelane .
      - name: Check the command line
        run: docker run --rm hirelane --version
      - name: Check the web interface
        run: |
          docker run -d --name hirelane-web -e HIRELANE_SECRET_WEB_TOKEN=ci-token -p 8766:8766 hirelane
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8766/healthz && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8766/healthz
          docker logs hirelane-web
