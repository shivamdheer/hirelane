<rect x="355.5" y="90.5" width="289" height="119" rx="9.5" fill="none" stroke="#30363d"/>
<circle cx="388" cy="123" r="13" fill="none" stroke="#5b8def" stroke-width="1.6"/>
<text x="388" y="128.5" font-size="14.5" font-weight="600" fill="#5b8def" text-anchor="middle">2</text>
<text x="413" y="130" font-size="20" font-weight="650" fill="#e6edf3" text-anchor="start">Filter and score</text>
<text x="377" y="160" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">Level, place, pay and</text>
<text x="377" y="182" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">skills, fit A to C</text>
<clipPath id="c3"><rect x="685" y="90" width="290" height="120" rx="10"/></clipPath>
