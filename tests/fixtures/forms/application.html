<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply to Data Analyst at Fabrikam</title></head>
<body>
<h1>Data Analyst</h1>
<form id="application_form" onsubmit="event.preventDefault(); document.getElementById('done').hidden = false;">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" type="text" required></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" type="text" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
  <div class="field"><label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" required></div>
  <div class="field">
    <label for="auth">Are you legally authorized to work in the United States? *</label>
    <select id="auth" name="auth" required>
      <option value="">Select...</option><option>Yes</option><option>No</option>
    </select>
  </div>
  <fieldset class="field">
    <legend>Will you now or in the future require visa sponsorship? *</legend>
    <label><input type="radio" name="sponsor" value="y" required> Yes</label>
    <label><input type="radio" name="sponsor" value="n"> No</label>
  </fieldset>
  <div class="field"><label for="why">Why do you want to work here?</label><textarea id="why" name="why"></textarea></div>
  <div class="field"><label for="color">What is your favorite color? *</label><input id="color" name="color" type="text" required></div>
  <div class="field"><label><input type="checkbox" name="privacy" required> I acknowledge the privacy policy *</label></div>
  <button type="submit">Submit application</button>
</form>
<p id="done" hidden>Thank you for applying. Your application has been submitted.</p>
</body>
</html>
