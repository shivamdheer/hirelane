<text x="83" y="130" font-size="20" font-weight="650" fill="#e6edf3" text-anchor="start">Job boards</text>
<text x="47" y="160" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">Greenhouse, Lever and</text>
<text x="47" y="182" font-size="15.5" font-weight="400" fill="#8b949e" text-anchor="start">Ashby public lists</text>
<clipPath id="c2"><rect x="355" y="90" width="290" height="120" rx="10"/></clipPath>
<rect x="355" y="90" width="290" height="120" rx="10" fill="#161b22"/>
